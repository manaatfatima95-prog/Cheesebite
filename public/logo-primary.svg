<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <defs>
    <linearGradient id="cheeseGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC727"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E59500"/>
    </linearGradient>
    <linearGradient id="badgeGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C20"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <!-- Centered Icon Badge -->
  <g transform="translate(62, 16)">
    <rect width="96" height="96" rx="26" fill="url(#badgeGradP)"/>
    <ellipse cx="48" cy="74" rx="28" ry="5" fill="#000000" opacity="0.35"/>
    <mask id="biteMaskP">
      <rect width="96" height="96" fill="#FFFFFF"/>
      <circle cx="72" cy="30" r="14" fill="#000000"/>
      <circle cx="75" cy="45" r="6" fill="#000000"/>
    </mask>
    <rect x="22" y="24" width="54" height="44" rx="10" fill="url(#cheeseGradP)" mask="url(#biteMaskP)"/>
    <circle cx="38" cy="42" r="4.8" fill="#D97706"/>
    <circle cx="56" cy="54" r="4.2" fill="#D97706"/>
    <circle cx="54" cy="38" r="2.8" fill="#D97706"/>
    <circle cx="30" cy="58" r="2.8" fill="#B71C1C"/>
  </g>

  <!-- Centered Typography -->
  <g text-anchor="middle">
    <!-- Primary Title: Chesee Bite -->
    <text x="110" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#141416" letter-spacing="0.5">
      Chesee <tspan fill="#FFB800">Bite</tspan>
    </text>
    <!-- Secondary Subtitle: RESTURENT -->
    <text x="110" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#71717A" letter-spacing="4.5">
      RESTURENT
    </text>
  </g>
</svg>
