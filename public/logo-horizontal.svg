<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="cheeseGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC727"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E59500"/>
    </linearGradient>
    <linearGradient id="badgeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C20"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(6, 6)">
    <rect width="64" height="64" rx="18" fill="url(#badgeGradH)"/>
    <ellipse cx="32" cy="49" rx="18" ry="3.5" fill="#000000" opacity="0.35"/>
    <mask id="biteMaskH">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <circle cx="48" cy="20" r="9.5" fill="#000000"/>
      <circle cx="50" cy="30" r="4" fill="#000000"/>
    </mask>
    <rect x="14" y="16" width="36" height="30" rx="7" fill="url(#cheeseGradH)" mask="url(#biteMaskH)"/>
    <circle cx="25" cy="29" r="3.2" fill="#D97706"/>
    <circle cx="37" cy="37" r="2.8" fill="#D97706"/>
    <circle cx="36" cy="26" r="1.8" fill="#D97706"/>
    <circle cx="19" cy="40" r="1.8" fill="#B71C1C"/>
  </g>

  <!-- Brand Wordmark Typography -->
  <g transform="translate(86, 0)">
    <!-- Primary Title: Chesee Bite -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#141416" letter-spacing="0.5">
      Chesee <tspan fill="#FFB800">Bite</tspan>
    </text>
    <!-- Secondary Subtitle: RESTURENT -->
    <text x="2" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#71717A" letter-spacing="4.5">
      RESTURENT
    </text>
  </g>
</svg>
